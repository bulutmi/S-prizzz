<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Sürpriz</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #08070b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #f3f3f6;
        }

        /* Arka Plan Atmosferik Işıklar */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 143, 84, 0.12) 0%, rgba(138, 43, 226, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: blur(60px);
        }

        /* Yüzen Parçacıklar */
        .particle {
            position: absolute;
            background: rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 8s linear infinite;
            z-index: 2;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Başlık Stili */
        .title-area h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #fff 30%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 1.2s ease-out;
        }

        /* Lüks Buton */
        .luxury-btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #08070b;
            border: none;
            padding: 18px 42px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .luxury-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.5);
        }

        .luxury-btn:active {
            transform: translateY(1px);
        }

        /* Sürpriz Alanı / Glassmorphism Kart */
        .surprise-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 100%;
            max-width: 440px;
            background: rgba(20, 18, 26, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            opacity: 0;
            visibility: hidden;
            transition: all 0.9s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .surprise-card.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Gerçekçi CSS 3D Çiçek Demeti */
        .bouquet-box {
            position: relative;
            width: 260px;
            height: 280px;
            margin-bottom: 25px;
        }

        .flower {
            position: absolute;
            animation: bloom 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes bloom {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Gül tasarımı katmanları */
        .rose {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ff3366 0%, #c2185b 70%, #880e4f 100%);
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            box-shadow: 0 5px 15px rgba(194, 24, 91, 0.5);
        }

        .rose::before, .rose::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 40%, rgba(255,255,255,0.25) 100%);
            top: -10px;
            left: -5px;
            transform: rotate(-15deg);
        }

        .rose-gold {
            background: radial-gradient(circle, #ff7043 0%, #d84315 70%, #bf360c 100%);
            box-shadow: 0 5px 15px rgba(216, 67, 21, 0.5);
        }

        .rose-white {
            background: radial-gradient(circle, #ffffff 0%, #e0e0e0 70%, #bdbdbd 100%);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        /* Çiçek Konumları */
        .f1 { top: 20px; left: 95px; animation-delay: 0.2s; z-index: 5; }
        .f2 { top: 50px; left: 35px; animation-delay: 0.4s; z-index: 4; }
        .f3 { top: 50px; right: 35px; animation-delay: 0.6s; z-index: 4; }
        .f4 { top: 110px; left: 65px; animation-delay: 0.8s; z-index: 3; }
        .f5 { top: 110px; right: 65px; animation-delay: 1.0s; z-index: 3; }

        /* Saplar ve Buket Ambalajı */
        .stems {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 120px;
            background: linear-gradient(to bottom, transparent, #2e7d32);
            clip-path: polygon(40% 0%, 60% 0%, 75% 100%, 25% 100%);
            opacity: 0.8;
            z-index: 1;
        }

        .wrapper-paper {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 110px;
            background: linear-gradient(135deg, #d4af37 0%, #2c223b 100%);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 2;
            opacity: 0.9;
        }

        .ribbon {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 20px;
            background: #ff3366;
            border-radius: 10px;
            z-index: 6;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        /* İmza Metni */
        .signature-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-style: italic;
            color: #d4af37;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s ease 0.6s;
        }

        .surprise-card.active .signature-text {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div id="particleContainer"></div>

    <!-- Giriş Ekranı -->
    <div class="main-container" id="mainContainer">
        <div class="title-area">
            <h1>Özel Bir Dokunuş Bekliyor</h1>
        </div>
        <button class="luxury-btn" onclick="openSurprise()">Sürprizi Gör</button>
    </div>

    <!-- Sürpriz ve Çiçek Kartı -->
    <div class="surprise-card" id="surpriseCard">
        <div class="bouquet-box">
            <div class="stems"></div>
            <div class="wrapper-paper"></div>
            <div class="ribbon"></div>
            
            <!-- Katmanlı Lüks Çiçekler -->
            <div class="flower f1 rose"></div>
            <div class="flower f2 rose-gold"></div>
            <div class="flower f3 rose-white"></div>
            <div class="flower f4 rose-gold"></div>
            <div class="flower f5 rose"></div>
        </div>
        <div class="signature-text">Sana Gönderen: Bay Hiçkimse</div>
    </div>

    <script>
        // Arka plan hareketli lüks parçacıklar
        const container = document.getElementById('particleContainer');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 4 + 2;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDuration = `${Math.random() * 6 + 5}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            container.appendChild(p);
        }

        function openSurprise() {
            const mainContainer = document.getElementById('mainContainer');
            const surpriseCard = document.getElementById('surpriseCard');

            // Giriş ekranını yavaşça kapat
            mainContainer.style.transition = 'all 0.6s ease';
            mainContainer.style.opacity = '0';
            mainContainer.style.transform = 'scale(0.95)';

            setTimeout(() => {
                mainContainer.style.display = 'none';
                // Sürpriz kartını ve çiçekleri zarifçe aç
                surpriseCard.classList.add('active');
            }, 500);
        }
    </script>
</body>
</html>
