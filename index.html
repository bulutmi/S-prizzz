<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050508;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        /* Arka plan ışık süzmesi */
        .ambient-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.12) 0%, rgba(138, 43, 226, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: blur(80px);
        }

        /* Parçacıklar */
        .particle {
            position: absolute;
            background: rgba(255, 105, 180, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 7s linear infinite;
            z-index: 2;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-area h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            font-weight: 600;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 30%, #ff758c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease-out;
        }

        .luxury-btn {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: #fff;
            border: none;
            padding: 18px 45px;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            outline: none;
        }

        .luxury-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 35px rgba(255, 65, 108, 0.6);
        }

        .luxury-btn:active {
            transform: translateY(1px);
        }

        /* Sürpriz Alanı / Glassmorphism Kart */
        .surprise-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 100%;
            max-width: 420px;
            background: rgba(18, 15, 25, 0.85);
            border: 1px solid rgba(255, 75, 110, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            opacity: 0;
            visibility: hidden;
            transition: all 0.9s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .surprise-card.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Gerçekçi Çiçek Demeti Tasarımı */
        .bouquet-box {
            position: relative;
            width: 280px;
            height: 310px;
            margin-bottom: 20px;
        }

        /* 3D Güller */
        .rose {
            position: absolute;
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 35% 35%, #ff4d6d 0%, #d90429 60%, #780016 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(217, 4, 41, 0.6);
            opacity: 0;
            transform: scale(0);
            animation: bloomRose 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Gül katmanları ve kıvrımları */
        .rose::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 60% 60%, rgba(255,255,255,0.3) 0%, transparent 60%);
            border: 2px dashed rgba(255, 182, 193, 0.4);
        }

        .rose::after {
            content: '';
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            background: #900;
        }

        .rose-pink {
            background: radial-gradient(circle at 35% 35%, #ff758c 0%, #ff477e 60%, #c9184a 100%);
            box-shadow: 0 10px 25px rgba(255, 71, 126, 0.6);
        }
        .rose-pink::after { background: #a51c30; }

        .rose-white {
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f1f1f1 60%, #cbd5e1 100%);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.4);
        }
        .rose-white::after { background: #94a3b8; }

        /* Konumlar ve Çıkış Gecikmeleri */
        .r1 { top: 10px; left: 98px; animation-delay: 0.2s; z-index: 5; transform-origin: center bottom; }
        .r2 { top: 45px; left: 35px; animation-delay: 0.4s; z-index: 4; }
        .r3 { top: 45px; right: 35px; animation-delay: 0.6s; z-index: 4; }
        .r4 { top: 105px; left: 65px; animation-delay: 0.8s; z-index: 3; }
        .r5 { top: 105px; right: 65px; animation-delay: 1.0s; z-index: 3; }

        /* Buket Yaprakları (Yeşillikler) */
        .leaf {
            position: absolute;
            width: 40px;
            height: 70px;
            background: linear-gradient(135deg, #2d6a4f, #1b4332);
            border-radius: 0 100% 0 100%;
            opacity: 0;
            transform: scale(0);
            animation: bloomRose 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .l1 { top: 80px; left: 15px; transform: rotate(-35deg); animation-delay: 0.3s; }
        .l2 { top: 80px; right: 15px; transform: rotate(35deg); animation-delay: 0.5s; }

        @keyframes bloomRose {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Buket Ambalajı / Kağıdı */
        .bouquet-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 130px;
            background: linear-gradient(135deg, #2c223b 0%, #1a1528 100%);
            border: 1px solid rgba(255, 75, 110, 0.3);
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            z-index: 6;
            opacity: 0;
            animation: showWrapper 0.8s ease 0.6s forwards;
        }

        @keyframes showWrapper {
            to { opacity: 1; }
        }

        .ribbon {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 22px;
            background: #ff477e;
            border-radius: 12px;
            z-index: 7;
            box-shadow: 0 4px 12px rgba(255, 71, 126, 0.5);
            opacity: 0;
            animation: showWrapper 0.8s ease 0.8s forwards;
        }

        /* İmza */
        .signature-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-style: italic;
            color: #ff758c;
            letter-spacing: 1px;
            text-shadow: 0 2px 15px rgba(255, 117, 140, 0.4);
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s ease 0.7s;
        }

        .surprise-card.active .signature-text {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div id="particleContainer"></div>

    <div class="main-container" id="mainContainer">
        <div class="title-area">
            <h1>Özel Sürpriz</h1>
        </div>
        <button class="luxury-btn" onclick="openSurprise()">Sürprizi Gör</button>
    </div>

    <div class="surprise-card" id="surpriseCard">
        <div class="bouquet-box">
            <!-- Yapraklar -->
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>

            <!-- Güller -->
            <div class="rose r1"></div>
            <div class="rose-pink rose r2"></div>
            <div class="rose-white rose r3"></div>
            <div class="rose-pink rose r4"></div>
            <div class="rose r5"></div>

            <!-- Ambalaj ve Kurdele -->
            <div class="bouquet-wrapper"></div>
            <div class="ribbon"></div>
        </div>
        <div class="signature-text">Sana Gönderen: Bay Hiçkimse</div>
    </div>

    <script>
        const container = document.getElementById('particleContainer');
        for (let i = 0; i < 35; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 5 + 2;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDuration = `${Math.random() * 6 + 4}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            container.appendChild(p);
        }

        function openSurprise() {
            const mainContainer = document.getElementById('mainContainer');
            const surpriseCard = document.getElementById('surpriseCard');

            mainContainer.style.transition = 'all 0.5s ease';
            mainContainer.style.opacity = '0';
            mainContainer.style.transform = 'scale(0.9)';

            setTimeout(() => {
                mainContainer.style.display = 'none';
                surpriseCard.classList.add('active');
            }, 400);
        }
    </script>
</body>
</html>
